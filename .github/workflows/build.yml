name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar llave de firma (si existe el secreto)
        id: ks
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK firmado
        if: steps.ks.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Compilar APK de prueba (sin llave configurada)
        if: steps.ks.outputs.signed != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p dist
          f=$(find app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$f" dist/CipherHealth-${{ github.ref_name }}.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CipherHealth-apk
          path: dist/*

      - name: Publicar Release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
